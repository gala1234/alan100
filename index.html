<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALAN 100 - by Alan Bracho</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
        .touch-container { position: absolute; bottom: 0; width: 100%; height: 100%; display: flex; z-index: 5; pointer-events: auto; }
        .player-controls { flex: 1; display: flex; position: relative; }
        .move-zone { width: 50%; height: 100%; background: rgba(255,255,255,0.01); border-right: 1px solid rgba(255,255,255,0.05); }
        .cam-zone { width: 50%; height: 100%; background: rgba(255,255,255,0.02); }
        
        .action-btn {
            position: absolute; bottom: 120px; right: 20px; width: 80px; height: 80px;
            background: rgba(231, 76, 60, 0.7); border: 4px solid white; border-radius: 50%;
            color: white; display: none; align-items: center; justify-content: center;
            font-weight: 900; font-size: 12px; pointer-events: auto; z-index: 60;
        }

        #menu, #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        .btn-menu {
            background: #e74c3c; color: white; padding: 20px 60px; margin: 10px;
            border-radius: 50px; font-weight: 900; text-transform: uppercase;
            cursor: pointer; border: 3px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 25px rgba(231, 76, 60, 0.4);
            transition: transform 0.1s;
        }
        .btn-menu:active { transform: scale(0.95); }
        .brand-text { color: #f1c40f; letter-spacing: 4px; font-weight: 900; text-shadow: 0 0 10px rgba(241,196,15,0.5); }
        #status-msg { position: absolute; top: 120px; width: 100%; text-align: center; color: #f1c40f; font-weight: bold; opacity: 0; transition: 0.5s; z-index: 60; }
        .combo-hint { position: absolute; bottom: 10%; width: 100%; text-align: center; color: white; font-size: 10px; opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

    <div id="menu">
        <h2 class="brand-text text-xl mb-1 italic">ALAN BRACHO</h2>
        <h1 class="text-7xl font-black text-white mb-6 tracking-tighter text-center">ALAN 100</h1>
        <p class="text-gray-400 mb-10 font-bold text-sm uppercase text-center px-6 tracking-widest">¡COMBOS DE SALTO ACTIVADOS!</p>
        <div class="flex flex-wrap justify-center">
            <div id="start1P" class="btn-menu">Jugar Solo</div>
            <div id="start2P" class="btn-menu" style="background: #2ecc71;">Cooperativo</div>
        </div>
    </div>

    <div id="ui-layer">
        <div class="p-6 flex justify-between text-white font-black text-sm uppercase tracking-tighter">
            <div id="uiLevel">NIVEL: 1 / 100</div>
            <div id="uiLives">❤️ 5</div>
        </div>
        <div id="status-msg">COMBINACIÓN LOGRADA</div>
        <div id="actionBtn" class="action-btn">DISPARAR</div>
        <div class="combo-hint">Doble Der: Doble Salto | Der+Izq: Culada | Izq+Der+Izq: Triple Salto</div>
    </div>

    <div id="touch-controls-root" class="touch-container" style="display: none;"></div>

    <div id="overlay" style="display:none;">
        <h1 class="text-6xl font-black text-red-600 mb-2">DERROTA</h1>
        <div id="restartBtn" class="btn-menu">Reintentar Nivel</div>
    </div>

    <script>
        const WORLDS = [
            { sky: 0x87CEEB, ground: 0x27ae60, platform: 0x7f8c8d, wall: 0x2c3e50 },
            { sky: 0xf39c12, ground: 0xd35400, platform: 0xecf0f1, wall: 0x34495e },
            { sky: 0x2c3e50, ground: 0x16a085, platform: 0x95a5a6, wall: 0x000000 },
            { sky: 0x8e44ad, ground: 0x2c3e50, platform: 0xd35400, wall: 0x2c2c2c },
            { sky: 0xc0392b, ground: 0x212121, platform: 0xe74c3c, wall: 0x1a1a1a }
        ];

        let scene, renderer, clock;
        let isMultiplayer = false;
        let nivelActual = 1;
        let vidas = 5;
        let players = [];
        let worldElements = [], enemies = [], stars = [], flags = [], powerUps = [], projectiles = [];
        let gameState = 'menu';

        const inputs = [
            { forward: 0, right: 0, jump: false, action: false, lookX: 0, tapQueue: [] },
            { forward: 0, right: 0, jump: false, action: false, lookX: 0, tapQueue: [] }
        ];

        function init() {
            scene = new THREE.Scene();
            clock = new THREE.Clock();
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);
            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(20, 40, 20);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setupTouchUI(numPlayers) {
            const root = document.getElementById('touch-controls-root');
            root.style.display = 'flex';
            root.innerHTML = '';
            for(let i = 0; i < numPlayers; i++) {
                const pCont = document.createElement('div');
                pCont.className = 'player-controls';
                pCont.innerHTML = `<div class="move-zone" id="move-${i}"></div><div class="cam-zone" id="cam-${i}"></div>`;
                root.appendChild(pCont);
                const moveZ = pCont.querySelector(`#move-${i}`);
                const camZ = pCont.querySelector(`#cam-${i}`);
                let mS = null, cS = null, cM = false, tS = 0;

                moveZ.addEventListener('touchstart', e => { e.preventDefault(); mS = e.touches[0]; tS = Date.now(); }, {passive: false});
                moveZ.addEventListener('touchmove', e => {
                    if(!mS) return;
                    const t = Array.from(e.touches).find(x => x.target === moveZ);
                    if(t) { inputs[i].forward = -(t.clientY - mS.clientY) * 0.018; inputs[i].right = (t.clientX - mS.clientX) * 0.018; }
                }, {passive: false});
                moveZ.addEventListener('touchend', () => { 
                    if (Date.now() - tS < 200) inputs[i].tapQueue.push({ side: 'L', time: Date.now() });
                    mS = null; inputs[i].forward = 0; inputs[i].right = 0; 
                });

                camZ.addEventListener('touchstart', e => { e.preventDefault(); cS = e.touches[0]; cM = false; tS = Date.now(); }, {passive: false});
                camZ.addEventListener('touchmove', e => {
                    if(!cS) return;
                    const t = Array.from(e.touches).find(x => x.target === camZ);
                    if(t) { const dx = t.clientX - cS.clientX, dy = t.clientY - cS.clientY; if(Math.abs(dx)>10 || Math.abs(dy)>10) cM = true; inputs[i].lookX = dx * 0.005; cS = t; }
                }, {passive: false});
                camZ.addEventListener('touchend', () => { 
                    if (!cM && (Date.now() - tS) < 250) inputs[i].tapQueue.push({ side: 'R', time: Date.now() });
                    cS = null; inputs[i].lookX = 0; 
                });
            }
            document.getElementById('actionBtn').addEventListener('touchstart', e => { e.preventDefault(); inputs[0].action = true; });
        }

        function createMushroom(color) {
            const group = new THREE.Group();
            // Tallo
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.6), new THREE.MeshPhongMaterial({ color: 0xffffff }));
            group.add(stem);
            // Sombrero
            const cap = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshPhongMaterial({ color }));
            cap.position.y = 0.3;
            group.add(cap);
            return group;
        }

        class Player {
            constructor(id, color, startPos) {
                this.id = id;
                this.group = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.4), new THREE.MeshPhongMaterial({ color }));
                body.position.y = 0.5; this.group.add(body);
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshPhongMaterial({ color: 0xffdbac }));
                head.position.y = 1.25; this.group.add(head);
                this.checkpoint = startPos.clone();
                this.group.position.copy(startPos);
                scene.add(this.group);
                this.velY = 0; this.rotationY = 0; this.onGround = false; this.power = 'none'; this.powerTimer = 0; this.hasShield = false;
                this.raycaster = new THREE.Raycaster();
                this.camera = new THREE.PerspectiveCamera(75, (window.innerWidth / (isMultiplayer ? 2 : 1)) / window.innerHeight, 0.1, 1000);
                this.jumpCount = 0; this.groundPound = false;
            }

            update() {
                const input = inputs[this.id];
                this.rotationY -= input.lookX; this.group.rotation.y = this.rotationY;
                let sM = this.power === 'speed' ? 1.4 : 1.0;
                const moveVec = new THREE.Vector3(input.right * sM, 0, -input.forward * sM);
                moveVec.applyQuaternion(this.group.quaternion);
                this.group.position.add(moveVec);

                // PROCESAR COMBOS
                if (input.tapQueue.length > 0) {
                    const now = Date.now();
                    input.tapQueue = input.tapQueue.filter(t => now - t.time < 800);
                    const sequence = input.tapQueue.map(t => t.side).join('');

                    if (sequence === 'R' || sequence === 'RR') {
                        if (this.onGround || (sequence === 'RR' && this.jumpCount < 2)) {
                            this.velY = 0.32; this.onGround = false; this.jumpCount++;
                            input.tapQueue = [];
                        }
                    } else if (sequence === 'RL') {
                        if (!this.onGround) { this.velY = -0.6; this.groundPound = true; showMsg("¡CULADA!"); input.tapQueue = []; }
                    } else if (sequence === 'LRL') {
                        if (this.onGround) { this.velY = 0.55; this.onGround = false; showMsg("¡TRIPLE SALTO!"); input.tapQueue = []; }
                    }
                }

                if (input.action && this.power === 'fire') { this.shootFire(); input.action = false; }
                this.velY -= (this.power === 'wings' ? 0.005 : 0.012);
                this.group.position.y += this.velY;

                this.raycaster.set(this.group.position.clone().add(new THREE.Vector3(0, 1.5, 0)), new THREE.Vector3(0, -1, 0));
                const hits = this.raycaster.intersectObjects(worldElements);
                if (hits.length > 0 && hits[0].distance < 1.6 && this.velY <= 0) {
                    this.group.position.y = hits[0].point.y; this.velY = 0; this.onGround = true; this.jumpCount = 0; this.groundPound = false;
                } else { this.onGround = false; }

                flags.forEach(f => { if (this.group.position.distanceTo(f.position) < 3.0 && !f.activated) { f.activated = true; f.children[0].material.color.set(0x2ecc71); this.checkpoint.copy(f.position); showMsg("¡CHECKPOINT!"); } });
                powerUps.forEach((pu, idx) => { if (this.group.position.distanceTo(pu.mesh.position) < 3.0) { this.applyPower(pu.type); scene.remove(pu.mesh); powerUps.splice(idx, 1); } });
                if (this.group.position.y < -15) this.respawn();
                if (this.powerTimer > 0) { this.powerTimer--; if (this.powerTimer === 0) { this.power = 'none'; this.hasShield = false; document.getElementById('actionBtn').style.display = 'none'; } }
                const off = new THREE.Vector3(0, 5, 10).applyQuaternion(this.group.quaternion);
                this.camera.position.lerp(this.group.position.clone().add(off), 0.1);
                this.camera.lookAt(this.group.position.clone().add(new THREE.Vector3(0, 1, 0)));
            }

            shootFire() {
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshPhongMaterial({ color: 0xff4500 }));
                b.position.copy(this.group.position).add(new THREE.Vector3(0, 1, 0)); scene.add(b);
                const d = new THREE.Vector3(0, 0, -1).applyQuaternion(this.group.quaternion);
                projectiles.push({ mesh: b, vel: d.multiplyScalar(0.35), life: 100, owner: 'player' });
            }

            applyPower(type) {
                this.power = type; this.powerTimer = 800;
                showMsg("PODER: " + type.toUpperCase());
                if (type === 'fire') document.getElementById('actionBtn').style.display = 'flex';
                if (type === 'shield') this.hasShield = true;
            }

            takeDamage() {
                if (this.hasShield) { this.hasShield = false; this.power = 'none'; showMsg("ESCUDO ROTO"); return; }
                vidas--; updateUI(); showMsg("DAÑO ❤️ -1"); if (vidas <= 0) gameOver();
            }

            respawn() { vidas--; updateUI(); showMsg("¡CAÍDA!"); if (vidas <= 0) gameOver(); else { this.group.position.copy(this.checkpoint); this.group.position.y += 3; this.velY = 0; } }
        }

        class Enemy {
            constructor(type, x, y, z) {
                this.type = type;
                const colors = { black: 0x111111, red: 0xe74c3c, blue: 0x3498db };
                this.mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: colors[type] }));
                this.mesh.position.set(x, y, z); scene.add(this.mesh);
                this.velY = 0; this.timer = Math.random() * 10; this.alive = true;
                this.speed = type === 'black' ? 0.08 : 0.035; 
            }
            update() {
                if (!this.alive) return;
                let target = players[0].group.position, dist = this.mesh.position.distanceTo(target);
                if (dist < 25) { const dir = new THREE.Vector3().subVectors(target, this.mesh.position).normalize(); this.mesh.position.x += dir.x * this.speed; this.mesh.position.z += dir.z * this.speed; this.mesh.lookAt(target.x, this.mesh.position.y, target.z); }
                if (this.type === 'red' && dist < 18 && Math.floor(this.timer) % 6 === 0 && this.timer % 1 < 0.02) {
                    const p = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshPhongMaterial({ color: 0x000000 }));
                    p.position.copy(this.mesh.position); scene.add(p);
                    const d = new THREE.Vector3().subVectors(target, this.mesh.position).normalize();
                    projectiles.push({ mesh: p, vel: d.multiplyScalar(0.12), life: 150, owner: 'enemy' });
                }
                if (this.type === 'blue' && Math.floor(this.timer) % 5 === 0 && this.timer % 1 < 0.02 && Math.abs(this.velY) < 0.01) this.velY = 0.22;
                this.velY -= 0.012; this.mesh.position.y += this.velY;
                if (this.mesh.position.y < 0.5) { this.mesh.position.y = 0.5; this.velY = 0; }
                if (dist < 1.8) { players[0].takeDamage(); this.alive = false; scene.remove(this.mesh); }
            }
        }

        function createLevel(n) {
            [worldElements, enemies, stars, flags, powerUps, projectiles].forEach(arr => { arr.forEach(obj => scene.remove(obj.mesh || obj)); arr.length = 0; });
            const style = WORLDS[Math.floor((n-1)/20) % WORLDS.length];
            scene.background = new THREE.Color(style.sky);
            const wS = 50 + (n * 1.5);
            const ground = new THREE.Mesh(new THREE.BoxGeometry(wS, 2, 160), new THREE.MeshPhongMaterial({ color: style.ground }));
            ground.position.set(0, -1, -70); scene.add(ground); worldElements.push(ground);
            const wL = new THREE.Mesh(new THREE.BoxGeometry(2, 40, 160), new THREE.MeshPhongMaterial({ color: style.wall }));
            wL.position.set(-(wS/2 + 1), 10, -70); scene.add(wL);
            const wR = new THREE.Mesh(new THREE.BoxGeometry(2, 40, 160), new THREE.MeshPhongMaterial({ color: style.wall }));
            wR.position.set((wS/2 + 1), 10, -70); scene.add(wR);

            const eTypes = ['black', 'red', 'blue'], pTypes = { fire: 0xff4500, wings: 0xf1c40f, speed: 0x00ff00, shield: 0x9b59b6 };
            const pKeys = Object.keys(pTypes);
            for(let i=0; i < 15 + n; i++) {
                const ox = (Math.random() - 0.5) * wS, oz = -(25 + Math.random() * 120);
                if (i % 6 === 0) enemies.push(new Enemy(eTypes[Math.floor(Math.random()*3)], ox, 1, oz));
                if (i % 5 === 0) {
                    const type = pKeys[Math.floor(Math.random()*4)];
                    const pMesh = createMushroom(pTypes[type]);
                    pMesh.position.set(ox, 0.3, oz); scene.add(pMesh);
                    powerUps.push({ mesh: pMesh, type: type });
                }
            }
            for(let j=1; j<=3; j++) {
                const fG = new THREE.Group(); fG.add(new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.05), new THREE.MeshPhongMaterial({ color: 0xc0392b })));
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4), new THREE.MeshPhongMaterial({ color: 0x888888 }));
                pole.position.set(-0.6, 0, 0); fG.add(pole); fG.position.set((Math.random()-0.5)*wS, 2, -(40 * j));
                fG.activated = false; scene.add(fG); flags.push(fG);
            }
            const st = new THREE.Mesh(new THREE.OctahedronGeometry(2), new THREE.MeshPhongMaterial({ color: 0xf1c40f, emissive: 0xf1c40f }));
            st.position.set(0, 4, -145); scene.add(st); stars.push(st);
            players.forEach((p, idx) => { p.group.position.set(idx * 4 - 2, 2, 0); p.checkpoint.copy(p.group.position); p.velY = 0; });
        }

        function showMsg(t) { const el = document.getElementById('status-msg'); el.innerText = t; el.style.opacity = 1; setTimeout(() => el.style.opacity = 0, 1500); }
        function gameOver() { gameState = 'over'; document.getElementById('overlay').style.display = 'flex'; }
        function nextLevel() { nivelActual++; vidas = 5; updateUI(); createLevel(nivelActual); showMsg("¡NIVEL " + nivelActual + "!"); }
        function updateUI() { document.getElementById('uiLevel').innerText = `NIVEL: ${nivelActual} / 100`; document.getElementById('uiLives').innerText = `❤️ ${vidas}`; }

        function startGame(m) {
            isMultiplayer = m; gameState = 'jugando'; document.getElementById('menu').style.display = 'none';
            setupTouchUI(m ? 2 : 1); players = [new Player(0, 0xe74c3c, new THREE.Vector3(0, 2, 0))];
            if(m) players.push(new Player(1, 0x2ecc71, new THREE.Vector3(3, 2, 0)));
            createLevel(nivelActual);
        }

        function onWindowResize() { players.forEach(p => { p.camera.aspect = (window.innerWidth / (isMultiplayer ? 2 : 1)) / window.innerHeight; p.camera.updateProjectionMatrix(); }); renderer.setSize(window.innerWidth, window.innerHeight); }

        function animate() {
            requestAnimationFrame(animate); if(gameState !== 'jugando') return;
            players.forEach(p => p.update()); enemies.forEach(e => e.update());
            projectiles.forEach((p, idx) => {
                p.mesh.position.add(p.vel); p.life--; if(p.life <= 0) { scene.remove(p.mesh); projectiles.splice(idx, 1); }
                if(p.owner === 'player') { enemies.forEach(e => { if(e.alive && p.mesh.position.distanceTo(e.mesh.position) < 2.0) { e.alive = false; scene.remove(e.mesh); scene.remove(p.mesh); projectiles.splice(idx, 1); } }); }
            });
            stars.forEach(s => { s.rotation.y += 0.05; players.forEach(p => { if (p.group.position.distanceTo(s.position) < 3.0) nextLevel(); }); });
            flags.forEach(f => f.rotation.y += 0.02);
            powerUps.forEach(pu => { pu.mesh.rotation.y += 0.03; });
            if(!isMultiplayer) { renderer.setViewport(0, 0, window.innerWidth, window.innerHeight); renderer.setScissorTest(false); renderer.render(scene, players[0].camera); }
            else { const w = window.innerWidth, h = window.innerHeight; renderer.setScissorTest(true); renderer.setViewport(0, 0, w/2, h); renderer.setScissor(0, 0, w/2, h); renderer.render(scene, players[0].camera); renderer.setViewport(w/2, 0, w/2, h); renderer.setScissor(w/2, 0, w/2, h); renderer.render(scene, players[1].camera); }
        }

        document.getElementById('start1P').onclick = () => startGame(false);
        document.getElementById('start2P').onclick = () => startGame(true);
        document.getElementById('restartBtn').onclick = () => { vidas = 5; updateUI(); createLevel(nivelActual); gameState = 'jugando'; document.getElementById('overlay').style.display = 'none'; };
        window.onload = init;
    </script>
</body>
</html>
